version: '3.8'
services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: orchestrator
    environment:
      - PORT=8000
      - IDENTITY_MCP_URL=http://identity:8001
      - RISK_MCP_URL=http://risk:8004
      - OPERATIONS_MCP_URL=http://operations:8002
      - SECRETS_MCP_URL=http://secrets:8005
      - OBSERVABILITY_MCP_URL=http://observability:8003
      - AUDIT_MCP_URL=http://audit:8006
      - ENABLE_LANGCHAIN=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
    ports:
      - "8000:8000"
    depends_on:
      - identity
      - operations
      - observability
      - risk
      - secrets
      - audit

  identity:
    build:
      context: .
      dockerfile: mcps/identity_policy_mcp/Dockerfile
    container_name: identity
    environment:
      - DB_PATH=/data/operational.db
    ports:
      - "8001:8001"
    volumes:
      - ./infrastructure:/data

  operations:
    build:
      context: .
      dockerfile: mcps/operations_mcp/Dockerfile
    container_name: operations
    environment:
      - DB_PATH=/data/operational.db
      - AUDIT_MCP_URL=http://audit:8006
    ports:
      - "8002:8002"
    volumes:
      - ./infrastructure:/data
    depends_on:
      - audit

  observability:
    build:
      context: .
      dockerfile: mcps/observability_mcp/Dockerfile
    container_name: observability
    environment:
      - AUDIT_DB_PATH=/data/audit.db
    ports:
      - "8003:8003"
    volumes:
      - ./infrastructure:/data

  risk:
    build:
      context: .
      dockerfile: mcps/risk_approval_mcp/Dockerfile
    container_name: risk
    environment:
      - DB_PATH=/data/operational.db
      - AUDIT_MCP_URL=http://audit:8006
    ports:
      - "8004:8004"
    volumes:
      - ./infrastructure:/data
    depends_on:
      - audit

  secrets:
    build:
      context: .
      dockerfile: mcps/secrets_security_mcp/Dockerfile
    container_name: secrets
    environment:
      - SENSITIVE_PATTERNS=.env,SECRET,TOKEN,KEY,cert
    ports:
      - "8005:8005"

  audit:
    build:
      context: .
      dockerfile: mcps/audit_reporting_mcp/Dockerfile
    container_name: audit
    environment:
      - AUDIT_DB_PATH=/data/audit.db
    ports:
      - "8006:8006"
    volumes:
      - ./infrastructure:/data

volumes:
  db_data:
    driver: local
