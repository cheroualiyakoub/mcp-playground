[project]
name = "mcp-workshop-demo"
version = "0.1.0"
description = "Enterprise MCP Workshop Demo with FastMCP"
authors = [{name = "Workshop", email = "workshop@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "pandas>=2.0.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []